name: Playwright Tests

on: [push, pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx eslint .

      - name: Unit-test the report reviewer
        run: npm run review:test

      - run: npx playwright install --with-deps

      # The raw exit code does not end the pipeline: the review reads the report
      # first, so the job fails with a reason ("product defect" vs "broken runner")
      # instead of a bare "tests failed".
      - name: Run the regression suite
        id: regression
        continue-on-error: true
        run: npx playwright test

      - name: Review the report
        if: always()
        run: npm run --silent review -- --fail-on none >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the review on the PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- regression-report-review -->';
            const body = `${marker}\n${fs.readFileSync('playwright-report/review.md', 'utf8')}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find((c) => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

      # Last step: the verdict is what passes or fails the pipeline. A green suite
      # with retries still passes; any unrecovered failure fails, and the printed
      # verdict says whether to open a bug or re-run.
      - name: Verdict
        if: always()
        run: node scripts/review-report.mjs --quiet --fail-on any
