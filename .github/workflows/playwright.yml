name: Playwright Tests

on: [push, pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx eslint .

      - name: Unit-test the report reviewer
        run: npm run review:test

      - run: npx playwright install --with-deps

      - run: npx playwright test

      # The review runs even when the suite is red — a red run is exactly when
      # its triage (product defect vs. environment) is worth reading.
      - name: Review the report
        if: always()
        run: npm run --silent review >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the review on the PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- regression-report-review -->';
            const body = `${marker}\n${fs.readFileSync('playwright-report/review.md', 'utf8')}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find((c) => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
